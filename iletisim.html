<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Berkay Sağlam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Berkay Sağlam</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-outline-light btn-sm ms-lg-2" href="login.html">Giriş Yap</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5" id="app">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-primary text-white py-3">
                        <h3 class="mb-0 text-center fw-bold">İletişim Formu</h3>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="contactForm" action="sonuc.html" method="GET">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Ad Soyad</label>
                                    <input type="text" class="form-control" id="name" name="name" v-model="formData.name" placeholder="Adınız Soyadınız">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">E-posta</label>
                                    <input type="text" class="form-control" id="email" name="email" v-model="formData.email" placeholder="ornek@mail.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Telefon Numarası (11 Hane)</label>
                                <input type="text" class="form-control" id="phone" name="phone" v-model="formData.phone" placeholder="Örn: 05551234567">
                                <small class="text-muted">Başında sıfır ile birlikte 11 haneli yazınız.</small>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold d-block mb-2">Cinsiyet</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" v-model="formData.gender" value="Erkek">
                                        <label class="form-check-label">Erkek</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" v-model="formData.gender" value="Kadın">
                                        <label class="form-check-label">Kadın</label>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="fw-bold d-block mb-2">Abonelik</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="newsletter" v-model="formData.newsletter" value="Evet">
                                        <label class="form-check-label">Haber bültenine abone ol</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Mesajınız</label>
                                <textarea class="form-control" id="message" name="message" v-model="formData.message" rows="4" placeholder="Mesajınızı buraya yazın..."></textarea>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <button type="button" @click="validateWithVue" class="btn btn-success w-100 py-2 fw-bold shadow-sm">
                                        Vue.js ile Denetle
                                    </button>
                                </div>
                                <div class="col-md-6">
                                    <button type="button" onclick="validateWithJS()" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                        JavaScript ile Denetle
                                    </button>
                                </div>
                                <div class="col-12 mt-3 text-center">
                                    <button type="reset" class="btn btn-link text-danger text-decoration-none">Formu Sıfırla</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">&copy; 2026 Berkay Sağlam. Tüm hakları saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function validateWithJS() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            // Boşlukları temizleyerek telefonu alıyoruz
            const phone = document.getElementById('phone').value.replace(/\s/g, '');
            const message = document.getElementById('message').value.trim();
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^[0-9]+$/;

            if (name === "" || email === "" || phone === "" || message === "") {
                alert("JS Hatası: Lütfen tüm alanları doldurunuz!");
                return;
            }
            if (!emailRegex.test(email)) {
                alert("JS Hatası: E-posta adresi geçersiz!");
                return;
            }
            // Sayı kontrolü VE tam 11 hane kontrolü
            if (!phoneRegex.test(phone) || phone.length !== 11) {
                alert("JS Hatası: Telefon numarası sadece rakamlardan oluşmalı ve tam 11 haneli olmalıdır!");
                return;
            }

            alert("Saf JavaScript denetimi başarılı. Form gönderiliyor...");
            document.getElementById('contactForm').submit();
        }
    </script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    formData: {
                        name: '',
                        email: '',
                        phone: '',
                        gender: '',
                        message: '',
                        newsletter: false
                    }
                }
            },
            methods: {
                validateWithVue() {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    const phoneRegex = /^[0-9]+$/;
                    // Telefonun içindeki boşlukları temizleyerek kontrol et
                    const purePhone = this.formData.phone.toString().replace(/\s/g, '');
                    
                    if (!this.formData.name || !this.formData.email || !purePhone || !this.formData.message) {
                        alert("Vue.js Hatası: Boş alan bırakılamaz!");
                    } else if (!emailRegex.test(this.formData.email)) {
                        alert("Vue.js Hatası: E-posta formatı hatalı!");
                    } else if (!phoneRegex.test(purePhone) || purePhone.length !== 11) {
                        alert("Vue.js Hatası: Telefon numarası 11 haneli bir sayı olmalıdır!");
                    } else {
                        alert("Vue.js Framework denetimi başarılı. Form gönderiliyor...");
                        document.getElementById('contactForm').submit();
                    }
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
