<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Berkay Sağlam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Berkay Sağlam</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkımda</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="sehrim.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="mirasimiz.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="ilgi-alanlarim.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Giriş Yap</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark">Giriş Yap</h2>
                            <p class="text-muted small">Lütfen öğrenci bilgilerinizi kullanın</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">E-posta</label>
                                <input type="text" class="form-control py-2" id="loginEmail" placeholder="Örn: g211210001@sakarya.edu.tr">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Şifre</label>
                                <input type="password" class="form-control py-2" id="loginPassword" placeholder="Şifreniz">
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 fw-bold">Giriş Yap</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3 text-muted small">
                    <p>Varsayılan Kullanıcı: <strong>öğrenci_numaranız@sakarya.edu.tr</strong><br>
                    Şifre: <strong>Öğrenci Numaranız</strong></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">&copy; 2026 Berkay Sağlam</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Sayfanın hemen yenilenmesini engelle

            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // 1. Boşluk Kontrolü
            if (email === "" || pass === "") {
                alert("Lütfen tüm alanları doldurunuz!");
                return;
            }

            // 2. Email Format Kontrolü
            if (!emailRegex.test(email)) {
                alert("Lütfen geçerli bir e-posta adresi giriniz!");
                return;
            }

            // 3. Bilgi Kontrolü (Hoca genellikle öğrenci numarasını login şartı koşar)
            // Örnek: Numaran b211210001 ise email 'b211210001@sakarya.edu.tr' ve şifre 'b211210001' olmalı
            const studentId = email.split('@')[0]; // @ işaretinden öncesini al
            
            if (email === studentId + "@sakarya.edu.tr" && pass === studentId) {
                alert("Giriş başarılı! Hoş geldiniz " + studentId);
                // Başarılıysa yönlendir
                window.location.href = "index.html"; 
            } else {
                alert("Hata: Kullanıcı adı veya şifre yanlış!");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
