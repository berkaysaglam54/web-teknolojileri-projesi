<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sonucu - Berkay Sağlam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Berkay Sağlam</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center">
                        <h3 class="mb-0">Mesajınız Alındı!</h3>
                    </div>
                    <div class="card-body p-4">
                        <h5 class="border-bottom pb-2">Gönderilen Bilgiler:</h5>
                        <div id="resultArea" class="mt-3">
                            </div>
                        <div class="text-center mt-4">
                            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // URL'deki parametreleri (GET verilerini) yakalayan script
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const resultArea = document.getElementById('resultArea');
            
            let html = '<table class="table table-bordered">';
            urlParams.forEach((value, key) => {
                // Key isimlerini daha güzel gösterelim
                let label = key.charAt(0).toUpperCase() + key.slice(1);
                if(key === 'name') label = 'Ad Soyad';
                if(key === 'email') label = 'E-posta';
                if(key === 'phone') label = 'Telefon';
                if(key === 'gender') label = 'Cinsiyet';
                if(key === 'message') label = 'Mesaj';
                
                html += `<tr><th class="bg-light" style="width:30%">${label}</th><td>${value}</td></tr>`;
            });
            html += '</table>';
            
            resultArea.innerHTML = html;
        }
    </script>
</body>
</html>
